<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Asteroids Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050508;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    }
    canvas {
      display: block;
      background: #020205;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 8px #00ffcc;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 { font-size: 40px; margin-bottom: 10px; text-shadow: 0 0 15px #00ffcc; }
    #overlay p { font-size: 16px; margin-bottom: 20px; color: #fff; line-height: 1.5; }
    #start-btn {
      padding: 12px 28px;
      font-size: 18px;
      font-family: inherit;
      background: transparent;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      cursor: pointer;
      text-shadow: 0 0 8px #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
      transition: all 0.2s;
    }
    #start-btn:hover {
      background: #00ffcc;
      color: #050508;
    }
    .touch-controls {
      display: none;
      margin-top: 15px;
      gap: 15px;
    }
    @media (pointer: coarse) {
      .touch-controls { display: flex; }
    }
    .touch-btn {
      width: 55px;
      height: 55px;
      border: 2px solid #00ffcc;
      border-radius: 50%;
      background: rgba(0,255,204,0.1);
      color: #00ffcc;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div id="score">SCORE: 0</div>
      <div id="lives">LIVES: 3</div>
    </div>
    <div id="overlay">
      <h1 id="title">ASTEROIDS</h1>
      <p id="msg">Rotate: LEFT/RIGHT (or A/D)<br>Thrust: UP (or W)<br>Fire: SPACE</p>
      <button id="start-btn">PLAY</button>
    </div>
    <canvas id="game" width="800" height="600"></canvas>
  </div>

  <div class="touch-controls">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-thrust">▲</button>
    <button class="touch-btn" id="btn-right">▶</button>
    <button class="touch-btn" id="btn-fire">●</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const msgEl = document.getElementById('msg');
    const startBtn = document.getElementById('start-btn');

    let audioCtx = null;
    function playBeep(freq, type, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let score = 0;
    let lives = 3;
    let gameOver = true;
    let asteroids = [];
    let lasers = [];
    let particles = [];

    const ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 15,
      a: -Math.PI / 2,
      rot: 0,
      thrust: false,
      xv: 0,
      yv: 0
    };

    const keys = { left: false, right: false, up: false, space: false };

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.code === 'Space') {
        if (!keys.space && !gameOver) shootLaser();
        keys.space = true;
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.code === 'Space') keys.space = false;
    });

    function setupTouch(id, prop) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', e => { e.preventDefault(); if (prop === 'space') { if (!gameOver) shootLaser(); } else keys[prop] = true; });
      el.addEventListener('touchend', e => { e.preventDefault(); if (prop !== 'space') keys[prop] = false; });
    }
    setupTouch('btn-left', 'left');
    setupTouch('btn-right', 'right');
    setupTouch('btn-thrust', 'up');
    setupTouch('btn-fire', 'space');

    function resetShip() {
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.xv = 0;
      ship.yv = 0;
      ship.a = -Math.PI / 2;
    }

    function createAsteroid(x, y, r) {
      const vert = Math.floor(Math.random() * 5 + 7);
      const offsets = [];
      for (let i = 0; i < vert; i++) offsets.push(Math.random() * 0.4 + 0.8);
      const speed = Math.random() * 1.5 + 0.5;
      const angle = Math.random() * Math.PI * 2;
      return {
        x, y, r,
        xv: Math.cos(angle) * speed,
        yv: Math.sin(angle) * speed,
        a: Math.random() * Math.PI * 2,
        rot: (Math.random() - 0.5) * 0.04,
        vert, offsets
      };
    }

    function spawnAsteroids(count) {
      for (let i = 0; i < count; i++) {
        let x, y;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
        } while (Math.hypot(x - ship.x, y - ship.y) < 150);
        asteroids.push(createAsteroid(x, y, 40));
      }
    }

    function shootLaser() {
      if (lasers.length >= 6) return;
      lasers.push({
        x: ship.x + (4 / 3) * ship.r * Math.cos(ship.a),
        y: ship.y + (4 / 3) * ship.r * Math.sin(ship.a),
        xv: 8 * Math.cos(ship.a),
        yv: 8 * Math.sin(ship.a),
        dist: 0
      });
      playBeep(880, 'square', 0.08);
    }

    function explode(x, y, count = 15, color = '#00ffcc') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x, y,
          xv: Math.cos(angle) * speed,
          yv: Math.sin(angle) * speed,
          life: 30,
          color
        });
      }
      playBeep(120, 'sawtooth', 0.25);
    }

    function startGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      asteroids = [];
      lasers = [];
      particles = [];
      resetShip();
      spawnAsteroids(4);
      scoreEl.textContent = 'SCORE: 0';
      livesEl.textContent = 'LIVES: 3';
      overlay.style.display = 'none';
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    startBtn.addEventListener('click', startGame);

    function update() {
      if (gameOver) return;

      if (keys.left) ship.a -= 0.07;
      if (keys.right) ship.a += 0.07;
      if (keys.up) {
        ship.xv += 0.12 * Math.cos(ship.a);
        ship.yv += 0.12 * Math.sin(ship.a);
        if (Math.random() < 0.3) playBeep(90, 'triangle', 0.05);
      } else {
        ship.xv *= 0.985;
        ship.yv *= 0.985;
      }

      ship.x = (ship.x + ship.xv + canvas.width) % canvas.width;
      ship.y = (ship.y + ship.yv + canvas.height) % canvas.height;

      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x = (l.x + l.xv + canvas.width) % canvas.width;
        l.y = (l.y + l.yv + canvas.height) % canvas.height;
        l.dist += Math.hypot(l.xv, l.yv);
        if (l.dist > canvas.width * 0.75) {
          lasers.splice(i, 1);
        }
      }

      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x = (a.x + a.xv + canvas.width) % canvas.width;
        a.y = (a.y + a.yv + canvas.height) % canvas.height;
        a.a += a.rot;

        if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r) {
          explode(ship.x, ship.y, 25, '#ff3366');
          lives--;
          livesEl.textContent = 'LIVES: ' + lives;
          resetShip();
          if (lives <= 0) {
            gameOver = true;
            titleEl.textContent = 'GAME OVER';
            msgEl.textContent = 'Final Score: ' + score;
            startBtn.textContent = 'PLAY AGAIN';
            overlay.style.display = 'flex';
          }
          break;
        }

        for (let j = lasers.length - 1; j >= 0; j--) {
          const l = lasers[j];
          if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
            lasers.splice(j, 1);
            explode(a.x, a.y, 12, '#00ffcc');
            if (a.r > 25) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              score += 20;
            } else if (a.r > 15) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              score += 50;
            } else {
              score += 100;
            }
            scoreEl.textContent = 'SCORE: ' + score;
            asteroids.splice(i, 1);
            break;
          }
        }
      }

      if (asteroids.length === 0) {
        spawnAsteroids(Math.min(8, 4 + Math.floor(score / 300)));
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.xv;
        p.y += p.yv;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#020205';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.a);
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(ship.r, 0);
        ctx.lineTo(-ship.r * 0.8, -ship.r * 0.6);
        ctx.lineTo(-ship.r * 0.5, 0);
        ctx.lineTo(-ship.r * 0.8, ship.r * 0.6);
        ctx.closePath();
        ctx.stroke();

        if (keys.up) {
          ctx.strokeStyle = '#ff3366';
          ctx.shadowColor = '#ff3366';
          ctx.beginPath();
          ctx.moveTo(-ship.r * 0.6, -ship.r * 0.3);
          ctx.lineTo(-ship.r * 1.3 - Math.random() * 5, 0);
          ctx.lineTo(-ship.r * 0.6, ship.r * 0.3);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.strokeStyle = '#ff3366';
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 3;
      for (const l of lasers) {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.strokeStyle = '#ffffff';
      ctx.shadowColor = '#00ffcc';
      ctx.shadowBlur = 6;
      ctx.lineWidth = 2;
      for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.a);
        ctx.beginPath();
        for (let i = 0; i < a.vert; i++) {
          const angle = (i / a.vert) * Math.PI * 2;
          const rad = a.r * a.offsets[i];
          const px = Math.cos(angle) * rad;
          const py = Math.sin(angle) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      for (const p of particles) {
        ctx.strokeStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
