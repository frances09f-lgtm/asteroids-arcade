name: Arcade script validation
on:
  push:
    paths:
      - index.html
      - .github/workflows/fix-beam.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check game syntax and core features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'beamHit(r,r,r.r,()=>hitRock(i))' in s
          for feature in ('spawnCometNow','spawnUFO','defeatBoss','makeHazard','awardDrop','countdown','pause','localStorage','beamHit'):
              assert feature in s,feature
          Path('/tmp/asteroids.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/asteroids.js