name: Arcade checks and deploy
on:
  push:
    branches: [main, feature/daily-run]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/add_daily.py
      - run: node tests/daily-unit.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/smoke.cjs
      - run: node tests/daily-smoke.cjs
      - name: Retain tested integration
        if: github.ref == 'refs/heads/feature/daily-run'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Integrate verified daily run [skip ci]'
            git push origin HEAD:feature/daily-run
          fi
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir -p site && cp index.html daily.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
